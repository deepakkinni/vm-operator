---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: csivolumeinfos.cns.vmware.com
spec:
  group: cns.vmware.com
  names:
    kind: CsiVolumeInfo
    listKind: CsiVolumeInfoList
    plural: csivolumeinfos
    shortNames:
    - cvi
    singular: csivolumeinfo
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CsiVolumeInfo is the Schema for the csivolumeinfolist API. It tracks
          per-volume ownership between the CSI driver and vm-operator. vm-operator
          writes spec.vms; CSI writes status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CsiVolumeInfoSpec defines the desired state of CsiVolumeInfo.
            properties:
              diskPath:
                description: |-
                  DiskPath is the VMDK datastore path for the CNS volume. CSI writes
                  this field at Unregister time; vm-operator refreshes it just-in-time
                  before attaching.
                type: string
              diskUUID:
                description: |-
                  DiskUUID is the disk UUID for the CNS volume. This field is
                  informational and may drift from the authoritative value. Unset for
                  an fcd-retained volume, since the capture that fills it never runs on
                  that path.
                type: string
              pvName:
                description: PVName is the name of the bound PersistentVolume.
                type: string
              pvcName:
                description: PVCName is the name of the bound PersistentVolumeClaim.
                type: string
              pvcNamespace:
                description: |-
                  PVCNamespace is the namespace of the bound PersistentVolumeClaim. The
                  CsiVolumeInfo CR itself lives in CVINamespace.
                type: string
              vms:
                description: |-
                  VMs lists the VirtualMachine objects that have a relationship with
                  this volume. vm-operator is the sole writer of this field. The
                  presence of an entry indicates an attached or snapshot-retained
                  relationship.
                items:
                  description: VirtualMachineRef identifies a VM attached to the volume.
                  properties:
                    diskMode:
                      description: |-
                        DiskMode is the disk mode this VM attaches the volume in. CSI keys the
                        ownership-transfer decision on it: a Persistent (dependent) entry
                        triggers the best-effort unregister, while an independent entry leaves
                        the FCD registered and the volume CSIManaged. Written by vm-operator,
                        mirroring vm.spec.volumes[*].diskMode. An empty value is treated as
                        Persistent, matching the vm.spec default.
                      type: string
                    vmInstanceUUID:
                      description: VMInstanceUUID is the instance UUID of the VM.
                      type: string
                    vmName:
                      description: VMName is the VirtualMachine CR name.
                      type: string
                    volumeName:
                      description: |-
                        VolumeName is vm.spec.volumes[*].name on that VM. vm-operator writes it
                        so that a detach can correlate this entry to its vm.status.volumes
                        entry — and therefore to the device slot — after the volume has
                        already been removed from vm.spec.volumes. CSI does not read it.
                      type: string
                  required:
                  - vmName
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - vmName
                x-kubernetes-list-type: map
              volumeID:
                description: VolumeID is the CNS volume ID. This field is immutable
                  after creation.
                type: string
            required:
            - volumeID
            type: object
          status:
            description: CsiVolumeInfoStatus defines the observed state of CsiVolumeInfo.
            properties:
              conditions:
                description: Conditions describes the current conditions of the CsiVolumeInfo.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              error:
                description: Error contains a human-readable error message when Phase
                  is Failed.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the spec that was last
                  processed by the controller.
                format: int64
                type: integer
              ownership:
                description: Ownership indicates who currently manages this volume.
                type: string
              phase:
                description: Phase is the current lifecycle phase of the volume.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
